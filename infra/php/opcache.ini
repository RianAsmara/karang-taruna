; Production opcache. validate_timestamps=0 means PHP never re-checks
; files on disk — correct for an immutable image, and the reason a
; deploy must replace the container rather than swap files inside it.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=64M
