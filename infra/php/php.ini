; Financial evidence (receipts, transfer proofs) and documents are the
; largest things users upload; 12M covers a phone photo comfortably.
upload_max_filesize=12M
post_max_size=16M
memory_limit=256M
max_execution_time=60

; Never leak a stack trace to an end user; the log is the record.
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2

expose_php=Off
date.timezone=Asia/Jakarta
